<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Quốc kỳ Việt Nam">
  <defs>
    <linearGradient id="lacquer" x1="65" y1="55" x2="535" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E7352B"/><stop offset=".42" stop-color="#D92320"/><stop offset=".72" stop-color="#C8171D"/><stop offset="1" stop-color="#A90F18"/>
    </linearGradient>
    <linearGradient id="silk-light" x1="105" y1="70" x2="490" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF2CC" stop-opacity=".17"/><stop offset=".28" stop-color="#FFF2CC" stop-opacity="0"/><stop offset=".73" stop-color="#590D17" stop-opacity=".08"/><stop offset="1" stop-color="#590D17" stop-opacity=".2"/>
