# Cloudflare Worker for the class session API (spec 001, docs/devops/DEPLOY.md).
# Databases live in the Cloudflare account that deployed on 2026-11-03 (docs/devops/DEPLOY.md).
# Apply migrations before each deploy:
#   npx wrangler@3 d1 migrations apply sv-class-staging --remote --env staging
name = "sv-class-api"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Request logs include client IPs; keep them off (privacy, FR-018).
[observability]
enabled = false

[triggers]
crons = ["0 3 * * *"]

[env.staging]
name = "sv-class-api-staging"
vars = { ALLOWED_ORIGINS = "http://localhost:8080,https://*.vercel.app" }
[[env.staging.d1_databases]]
binding = "DB"
database_name = "sv-class-staging"
database_id = "41cd4702-fe95-4d37-9e2d-a09add081dd9"
migrations_dir = "migrations"

[env.production]
name = "sv-class-api"
# The production site and its Vercel preview URLs. Add a domain here when the site moves
# (CORS is not the access control; the teacher key is).
vars = { ALLOWED_ORIGINS = "https://vietnam-history-eight.vercel.app,https://vietnam-history-*-youngsterdumbs-projects.vercel.app" }
[[env.production.d1_databases]]
binding = "DB"
database_name = "sv-class-prod"
database_id = "319493f8-a94f-4660-9f29-851b1e6cc26b"
migrations_dir = "migrations"
