<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas harness (S3, tạm)</title>
  <style>
    html, body { margin: 0; height: 100%; background: #F4EEDD; color: #2B2926; font: 14px/1.4 "Noto Serif", Georgia, serif; }
    body { display: grid; grid-template-columns: 300px 1fr; }
    #map { position: relative; min-height: 0; }
    aside { padding: 12px; overflow: auto; border-right: 1px solid #c9bea5; }
    input { width: 100%; box-sizing: border-box; padding: 6px; font: inherit; }
    ul { list-style: none; padding: 0; margin: 8px 0; }
    li button { all: unset; cursor: pointer; display: block; padding: 3px 0; }
    #card { border-top: 1px solid #c9bea5; padding-top: 8px; }
    .note { font-size: 12px; color: #7A5C3E; }
    @media (max-width: 640px) {
      body { grid-template-columns: 1fr; grid-template-rows: 1fr 38%; }
      aside { order: 2; border: 0; border-top: 1px solid #c9bea5; }
    }
  </style>
</head>
<body>
  <aside>
    <input id="q" type="search" placeholder="Tìm địa danh, tỉnh…" autocomplete="off">
    <div id="kinds"></div>
    <ul id="list"></ul>
    <div id="card"></div>
    <p class="note">Nội dung minh họa, chưa được chuyên gia duyệt. Bản đồ © OpenStreetMap contributors.</p>
  </aside>
  <div id="map"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
