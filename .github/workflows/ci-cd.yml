# CI on every push; deploy to Vercel after checks pass.
#   Staging -> Preview deployment     main -> Production deployment
# Needs repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
name: CI/CD

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/check.sh

  deploy:
    needs: check
    if: github.ref_name == 'main' || github.ref_name == 'Staging'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      TARGET: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
      PROD_FLAG: ${{ github.ref_name == 'main' && '--prod' || '' }}
    steps:
      - name: Require Vercel secrets
        run: |
          for s in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            [ -n "${!s}" ] || { echo "::error::Missing repo secret $s (Settings > Secrets and variables > Actions)"; exit 1; }
          done
      - uses: actions/checkout@v7
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment="$TARGET" --token="$VERCEL_TOKEN"
      - run: vercel build $PROD_FLAG --token="$VERCEL_TOKEN"
      - run: vercel deploy --prebuilt $PROD_FLAG --token="$VERCEL_TOKEN"
